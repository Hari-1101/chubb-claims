server:
  port: 8080

spring:
  application:
    name: claims

  # Local dev values matching docker-compose.yml. Override via environment variables in other environments.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${DB_USERNAME:claims}
    password: ${DB_PASSWORD:claims}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Value (de)serialisers for ClaimEvent are set in KafkaConfig (JSON); keys are plain strings.
    producer:
      properties:
        max.block.ms: 5000   # if Kafka is down, fail fast (and log) instead of blocking the HTTP request for 60s
    consumer:
      auto-offset-reset: earliest   # a new consumer group starts from the beginning of the topic

claims:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}   # Angular dev server

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true   # keep the Authorize values across page reloads
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
